name: Deploy Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: secrets

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            set -e

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH=/var/www/persis-backend-v2
            fi

            RUN_MODE="${{ secrets.RUN_MODE }}"
            if [ -z "$RUN_MODE" ]; then
              RUN_MODE=dist
            fi

            echo "Deploying to $DEPLOY_PATH (mode=$RUN_MODE)"
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            # make sure we are on staging and up to date
            if [ -d .git ]; then
              git fetch --all
            else
              git clone $GIT_REPOSITORY "$DEPLOY_PATH"
            fi
            git reset --hard
            git checkout staging || git checkout -b staging
            git pull origin staging

            # install dependencies
            echo "📦 Installing dependencies (clean install)..."
            npm ci --no-audit --no-fund

            # build the project
            echo "🏗️ Building project..."
            npm run build

            # Restart the PM2 process by name (safer than ID 0)
            echo "🔄 Restarting PM2 process..."
            pm2 restart "8001 - Staging Persis Backend" --update-env

            echo "Deploy complete"